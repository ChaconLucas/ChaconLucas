name: Metrics

# Semanal: isocalendar e distribuicao de linguagens nao mudam de um dia p/ o
# outro, entao rodar diario so engordaria o historico sem ganho visual.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    name: Gera os cartoes de metrica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # sem o secret, os passos sao pulados e o job passa verde em vez de falhar
    env:
      TEM_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Aviso quando falta o token
        if: env.TEM_TOKEN != 'true'
        run: echo "::notice::Crie o secret METRICS_TOKEN para este workflow comecar a gerar as imagens."

      - name: Calendario isometrico
        if: env.TEM_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: metrics
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Linguagens por tempo de atividade
        if: env.TEM_TOKEN == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: metrics
          filename: metrics/linguagens.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
